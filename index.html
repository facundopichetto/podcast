<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="podcast">
<meta name="mobile-web-app-capable" content="yes">
<meta name="podcast-version" content="1.3">
<title>podcast</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root { color-scheme: dark; --bg:#000; --fg:#e8e8e8; --dim:#8a8a8a; --acc:#39ff88; --acc2:#ff5fd2; --line:#222; --card:#0d0d0d; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; background:var(--bg); color:var(--fg); font: 17px/1.5 -apple-system, system-ui, "Helvetica Neue", sans-serif; }
body { padding: max(14px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
h1 { font-size: 20px; margin: 4px 0 18px; letter-spacing: .04em; color: var(--acc); font-weight: 600; }
h1 small { color: var(--dim); font-weight: 400; font-size: 13px; margin-left: 8px; }
a { color: var(--acc); text-decoration: none; }
.hidden { display: none !important; }
/* lista */
.ep { display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; color:var(--fg); cursor:pointer; font: inherit; }
.ep:active { border-color: var(--acc); }
.ep .fecha { color: var(--dim); font-size: 13px; }
.ep .titulo { font-size: 18px; font-weight: 600; margin: 2px 0 4px; }
.ep .meta { color: var(--dim); font-size: 13px; }
.ep .meta b { color: var(--acc2); font-weight: 500; }
.ep .temas { margin-top: 6px; display:flex; flex-wrap:wrap; gap:6px; }
.tema { font-size: 12px; color: var(--fg); background:#161616; border-radius: 999px; padding: 2px 9px; }
/* player */
#volver { background:none; border:none; color:var(--dim); font: inherit; font-size: 15px; padding: 0; margin-bottom: 10px; cursor:pointer; }
#pt { font-size: 21px; font-weight: 600; margin: 0 0 2px; }
#pf { color: var(--dim); font-size: 13px; margin-bottom: 14px; }
select { flex:1; font: inherit; font-size: 15px; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
#barra { width:100%; margin: 6px 0 2px; accent-color: var(--acc); height: 28px; }
#tiempos { display:flex; justify-content:space-between; color:var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; margin-bottom: 12px; }
#botones { display:grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 10px; margin-bottom: 22px; }
#botones button { font: inherit; font-size: 17px; font-weight: 600; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius: 16px; padding: 22px 0; cursor:pointer; }
#botones button:active { border-color: var(--acc); }
#botones button small { display:block; font-weight: 400; font-size: 12px; color: var(--dim); margin-top: 2px; }
#play { background: var(--acc); color: #000; border-color: var(--acc); font-size: 20px; }
#vel { background:none; border:1px solid var(--line); color:var(--dim); border-radius:999px; font: inherit; font-size:13px; padding: 4px 12px; cursor:pointer; }
h2 { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin: 18px 0 8px; font-weight: 500; }
.cap { display:flex; gap: 12px; width:100%; text-align:left; background:none; border:none; border-bottom:1px solid var(--line); color:var(--fg); font: inherit; font-size: 16px; padding: 12px 4px; cursor:pointer; }
.cap .t { color: var(--acc2); font-variant-numeric: tabular-nums; min-width: 52px; }
.cap.actual { color: var(--acc); }
.cap.actual .t { color: var(--acc); }
.cap .d { margin-left:auto; color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
#modo { display:flex; align-items:center; justify-content:space-between; gap:10px; color:var(--dim); font-size:14px; margin: 4px 0 14px; }
#modo b { color: var(--acc2); font-weight: 500; }
#modo button { font: inherit; font-size: 14px; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor:pointer; }
#modo button.on { border-color: var(--acc); color: var(--acc); }
#guion { color: var(--dim); font-size: 13px; margin-top: 20px; }
</style>
</head>
<body>
<h1 id="cab">podcast <small id="ver"></small></h1>

<section id="lista"></section>

<section id="player" class="hidden">
  <button id="volver">‹ episodios</button>
  <div id="pt"></div>
  <div id="pf"></div>
  <audio id="audio" preload="metadata" playsinline></audio>
  <audio id="audio2" preload="none" playsinline></audio>
  <input id="barra" type="range" min="0" max="100" step="0.1" value="0">
  <div id="tiempos"><span id="t0">0:00</span><button id="vel">1x</button><span id="t1">0:00</span></div>
  <div id="botones">
    <button id="atras">‹ 10<small>segundos</small></button>
    <button id="play">play</button>
    <button id="adelante">30 ›<small>segundos</small></button>
  </div>
  <h2>capítulos</h2>
  <div id="modo"><span id="modotxt">episodio entero</span><button id="seguir" class="on">al terminar, sigue</button></div>
  <div id="caps"></div>
  <div id="guion"></div>
</section>

<script>
const $ = s => document.querySelector(s);
// dos elementos: el activo siempre tiene id="audio", el de precarga id="audio2".
// ios solo deja arrancar audio con pantalla bloqueada en un elemento ya "desbloqueado" por un
// gesto, por eso el episodio siguiente se precarga en el otro y se lo despierta con el primer play.
let audio = $('#audio'), otro = $('#audio2');
// voz fija daniela: la web ya no tiene selector (facundo, 2026-09-11)
const VOZ = 'daniela';
let datos = null, ep = null, voz = VOZ, caps = [];
let seguir = localStorage.seguir !== 'no', desbloqueado = false;
const VELS = [1, 1.15, 1.3];
// 0,2 s de silencio: sirve para despertar el segundo elemento dentro del gesto del play
const SILENCIO = 'data:audio/mpeg;base64,SUQzBAAAAAAAIlRTU0UAAAAOAAADTGF2ZjYxLjEuMTAwAAAAAAAAAAAAAAD/4zjAAAAAAAAAAAAASW5mbwAAAA8AAAAFAAACQACAgICAgICAgICAgICAgICAgICAoKCgoKCgoKCgoKCgoKCgoKCgoKDAwMDAwMDAwMDAwMDAwMDAwMDAwODg4ODg4ODg4ODg4ODg4ODg4ODg//////////////////////////8AAAAATGF2YzYxLjMuAAAAAAAAAAAAAAAAJALAAAAAAAAAAkC996QDAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD/4xjEAAAAA0gAAAAATEFNRTMuMTAwVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVUxBTUUzLjEwMFVVVVVVVVVVVVX/4xjEOwAAA0gAAAAAVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVX/4xjEdgAAA0gAAAAAVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVX/4xjEsQAAA0gAAAAAVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVX/4xjExAAAA0gAAAAAVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVU=';

// play() devuelve una promesa que se rechaza si algo pausa en el medio (AbortError): se come aca
function tocar(el) { const p = (el || audio).play(); if (p && p.catch) p.catch(() => {}); return p; }

const fmt = s => { s = Math.max(0, Math.floor(s || 0)); const m = Math.floor(s / 60), r = s % 60; const h = Math.floor(m / 60); return (h ? h + ':' + String(m % 60).padStart(2, '0') : m) + ':' + String(r).padStart(2, '0'); };
const min = s => Math.round((s || 0) / 60) + ' min';

async function cargar() {
  const r = await fetch('episodios.json?t=' + Date.now(), { cache: 'no-store' });
  datos = await r.json();
  const eps = datos.episodios || [];
  $('#ver').textContent = eps.length === 1 ? eps[0].fecha : eps.length + ' episodios';
  const unico = eps.length === 1;
  $('#volver').classList.toggle('hidden', unico);
  if (!eps.length) { $('#lista').textContent = 'todavia no hay episodio'; return; }
  if (unico) { abrir(eps[0]); return; }
  const l = $('#lista'); l.innerHTML = '';
  [...datos.episodios].reverse().forEach(e => {
    const b = document.createElement('button'); b.className = 'ep';
    const pos = +localStorage['pos:' + e.id] || 0;
    b.innerHTML = `<div class="fecha">${e.fecha}</div><div class="titulo">${e.titulo}</div>
      <div class="meta"><b>${min(e.duracion)}</b> · ${(e.voces[Object.keys(e.voces)[0]].capitulos || []).length} capítulos${pos > 30 ? ' · <b>seguís en ' + fmt(pos) + '</b>' : ''}</div>
      <div class="temas">${(e.temas || []).map(t => `<span class="tema">${t}</span>`).join('')}</div>`;
    b.onclick = () => abrir(e);
    l.appendChild(b);
  });
  const h = location.hash.slice(1);
  const e = datos.episodios.find(x => x.id === h);
  if (e) abrir(e);
}

// el mp3 del episodio entero (los capitulos son marcas de tiempo, no archivos aparte)
function fuente(e) {
  const d = e.voces[VOZ] || e.voces[Object.keys(e.voces)[0]];
  if (d.archivo) return d.archivo;
  // no deberia pasar: `recetas.podcast enteros` lo genera concatenando los bloques
  console.warn('el episodio ' + e.id + ' no tiene mp3 entero, suena solo el primer capitulo');
  return (d.capitulos || [{}])[0].archivo || '';
}

function abrir(e, play) {
  ep = e;
  location.hash = e.id;
  $('#lista').classList.add('hidden'); $('#player').classList.remove('hidden');
  $('#pt').textContent = e.titulo;
  $('#pf').textContent = `${e.fecha} · ${min(e.duracion)} · ${e.palabras || '?'} palabras`;
  voz = e.voces[VOZ] ? VOZ : Object.keys(e.voces)[0];
  poner(+localStorage['pos:' + e.id] || 0, !!play);
  $('#guion').innerHTML = e.guion ? `guión: <a href="guiones/${e.guion}">${e.guion}</a>` : '';
  if (!play) window.scrollTo(0, 0);
}

function poner(t, play) {
  const d = ep.voces[voz];
  caps = d.capitulos || [];
  const src = fuente(ep);
  if (audio.getAttribute('src') !== src) { audio.src = src; audio.load(); }
  const ir = () => { try { audio.currentTime = t; } catch (_) {} if (play) tocar(audio); pintarCaps(); };
  if (audio.readyState >= 1) ir(); else audio.addEventListener('loadedmetadata', ir, { once: true });
  pintarCaps();
  sesion();
  precargar();
}

// el episodio siguiente de la lista (el json va de mas viejo a mas nuevo)
function siguienteEp() {
  const eps = (datos || {}).episodios || [];
  const i = eps.findIndex(e => e.id === (ep || {}).id);
  return i >= 0 ? eps[i + 1] : null;
}

function precargar() {
  const s = siguienteEp();
  if (!s) return;
  const src = fuente(s);
  if (src && otro.getAttribute('src') !== src && desbloqueado) { otro.src = src; otro.load(); }
}

// despierta el elemento de precarga dentro del gesto del usuario: sin esto ios no lo deja
// arrancar solo cuando termina el episodio con la pantalla bloqueada
function desbloquear() {
  if (desbloqueado) return;
  desbloqueado = true;
  const s = siguienteEp();
  otro.src = s ? fuente(s) : SILENCIO;
  const p = tocar(otro);
  if (p && p.then) p.then(() => { otro.pause(); try { otro.currentTime = 0; } catch (_) {} }, () => {});
}

// al terminar un episodio arranca el siguiente en el OTRO elemento (ya desbloqueado) y los cambia
function pasarASiguiente() {
  const s = siguienteEp();
  if (!s) return false;
  const src = fuente(s);
  if (!src) return false;
  if (otro.getAttribute('src') !== src) { otro.src = src; otro.load(); }
  try { otro.currentTime = 0; } catch (_) {}
  tocar(otro);
  // el activo pasa a ser el otro: el id `audio` viaja con el que suena
  audio.removeAttribute('id'); otro.id = 'audio'; audio.id = 'audio2';
  const viejo = audio; audio = otro; otro = viejo;
  otro.pause(); otro.removeAttribute('src'); otro.load();
  localStorage['pos:' + ep.id] = 0;
  ep = s; location.hash = s.id;
  $('#pt').textContent = s.titulo;
  $('#pf').textContent = `${s.fecha} · ${min(s.duracion)} · ${s.palabras || '?'} palabras`;
  voz = s.voces[VOZ] ? VOZ : Object.keys(s.voces)[0];
  caps = (s.voces[voz] || {}).capitulos || [];
  $('#guion').innerHTML = s.guion ? `guión: <a href="guiones/${s.guion}">${s.guion}</a>` : '';
  pintarCaps(); sesion(); precargar();
  return true;
}

function capActual() {
  const t = audio.currentTime || 0;
  let i = -1;
  caps.forEach((k, j) => { if (t >= k.t - 0.5) i = j; });
  return i;
}

function saltarCap(paso) {
  if (!caps.length) return;
  let i = 0;
  caps.forEach((k, j) => { if (audio.currentTime >= k.t + (paso < 0 ? 3 : 0)) i = j; });
  const k = caps[Math.max(0, Math.min(caps.length - 1, i + paso))];
  if (k) { audio.currentTime = k.t; estado(); }
}

function pintarCaps() {
  const c = $('#caps'); c.innerHTML = '';
  const actual = capActual();
  caps.forEach((k, i) => {
    const b = document.createElement('button'); b.className = 'cap' + (i === actual ? ' actual' : '');
    b.innerHTML = `<span class="t">${fmt(k.t)}</span><span>${k.titulo}</span><span class="d">${min(k.duracion)}</span>`;
    b.onclick = () => { desbloquear(); audio.currentTime = k.t; tocar(audio); };
    c.appendChild(b);
  });
  const s = siguienteEp();
  $('#modotxt').textContent = s ? (seguir ? 'episodio entero · sigue con “' + s.titulo + '”' : 'episodio entero') : 'episodio entero';
  $('#seguir').className = seguir ? 'on' : '';
  $('#seguir').textContent = seguir ? 'al terminar, sigue' : 'al terminar, para';
  $('#seguir').classList.toggle('hidden', !s);
}

function sesion() {
  if (!('mediaSession' in navigator)) return;
  const ms = navigator.mediaSession;
  ms.metadata = new MediaMetadata({
    title: ep.titulo, artist: 'podcast del agente', album: ep.fecha,
    artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }] });
  ms.setActionHandler('play', () => { tocar(audio); });
  ms.setActionHandler('pause', () => { audio.pause(); });
  ms.setActionHandler('stop', () => { audio.pause(); });
  ms.setActionHandler('seekbackward', d => { audio.currentTime = Math.max(0, audio.currentTime - ((d || {}).seekOffset || 10)); estado(); });
  ms.setActionHandler('seekforward', d => { audio.currentTime = Math.min(audio.duration || 1e9, audio.currentTime + ((d || {}).seekOffset || 30)); estado(); });
  try { ms.setActionHandler('seekto', d => { if (d.seekTime != null) { audio.currentTime = d.seekTime; estado(); } }); } catch (_) {}
  try {
    ms.setActionHandler('previoustrack', caps.length > 1 ? () => saltarCap(-1) : null);
    ms.setActionHandler('nexttrack', caps.length > 1 ? () => saltarCap(1) : null);
  } catch (_) {}
  estado();
}

function estado() {
  if ('mediaSession' in navigator && audio.duration) {
    try { navigator.mediaSession.setPositionState({ duration: audio.duration, playbackRate: audio.playbackRate, position: Math.min(audio.currentTime, audio.duration) }); } catch (_) {}
  }
}

$('#volver').onclick = () => { audio.pause(); location.hash = ''; $('#player').classList.add('hidden'); $('#lista').classList.remove('hidden'); cargar(); };
$('#seguir').onclick = () => { seguir = !seguir; localStorage.seguir = seguir ? 'si' : 'no'; if (seguir) desbloquear(); pintarCaps(); };
$('#play').onclick = () => { desbloquear(); audio.paused ? tocar(audio) : audio.pause(); };
$('#atras').onclick = () => { audio.currentTime = Math.max(0, audio.currentTime - 10); estado(); };
$('#adelante').onclick = () => { audio.currentTime = Math.min(audio.duration || 1e9, audio.currentTime + 30); estado(); };
$('#vel').onclick = () => { const i = (VELS.indexOf(audio.playbackRate) + 1) % VELS.length; audio.playbackRate = VELS[i]; otro.playbackRate = VELS[i]; localStorage.vel = VELS[i]; $('#vel').textContent = VELS[i] + 'x'; };

// los dos elementos llevan los mismos handlers; solo actua el que esta activo
[$('#audio'), $('#audio2')].forEach(el => {
  el.playbackRate = +localStorage.vel || 1;
  el.onplay = function () {
    if (this !== audio) return;
    $('#play').textContent = 'pausa';
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
    desbloquear(); pintarCaps(); estado();
  };
  el.onpause = function () {
    if (this !== audio) return;
    $('#play').textContent = 'play';
    // la sesion del lock screen se queda viva: no se suelta el src y se reporta la posicion,
    // asi el play de los airpods reanuda este mismo elemento
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
    pintarCaps(); estado();
  };
  el.ontimeupdate = function () {
    if (this !== audio) return;
    const t = audio.currentTime, d = audio.duration || 0;
    $('#t0').textContent = fmt(t); $('#t1').textContent = '-' + fmt(d - t);
    if (!arrastrando) $('#barra').value = d ? (t / d * 100) : 0;
    if (Math.abs(t - ult) > 2) { ult = t; localStorage['pos:' + ep.id] = t; pintarCaps(); estado(); }
  };
  el.onended = function () {
    if (this !== audio) return;
    localStorage['pos:' + ep.id] = 0;
    if (seguir && pasarASiguiente()) return;
    pintarCaps();
  };
  el.ondurationchange = function () { if (this === audio) $('#t1').textContent = '-' + fmt(audio.duration); };
});
$('#vel').textContent = (+localStorage.vel || 1) + 'x';
let ult = 0, arrastrando = false;
$('#barra').oninput = () => { arrastrando = true; $('#t0').textContent = fmt($('#barra').value / 100 * (audio.duration || 0)); };
$('#barra').onchange = () => { audio.currentTime = $('#barra').value / 100 * (audio.duration || 0); arrastrando = false; estado(); };
document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') $('#atras').click(); if (e.key === 'ArrowRight') $('#adelante').click(); if (e.key === ' ') { e.preventDefault(); $('#play').click(); } });
cargar().catch(e => { $('#lista').textContent = 'no se pudo cargar episodios.json: ' + e; });
</script>
</body>
</html>
